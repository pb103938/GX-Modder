<div id="ModInfo">
    <div class="dispBox">
        <br>
        <div class="container">
            <div class="left-content">
                <div class="uploadContent" style="width: 540px;" id="ModInfoUploads1"></div>
                <div style="display: none;" id="ModInfoUploads2"></div>
                <div class="modInfoInputs container" id="modInfoInputs2">
                    <div class="colorSchemeContainer">
                        <div class="text__main-input-names">Light Accent Color:</div> <!--Primary color in mod-->
                            <p><input class="input__main-mod-info" style="width: 80px; margin-left: 7px;" type="color" name="lp" id="lp" min="0" max="100" placeholder="ex. 54" oninput="handleInput('lp', event)" required></p>
                        <br>
                        <div class="text__main-input-names">Light Secondary Base Color:</div> <!--Accent color in mod-->
                            <p><input class="input__main-mod-info" style="width: 80px; margin-left: 7px;" type="color" name="la" id="la" min="0" max="100" placeholder="ex. 54" oninput="handleInput('la', event)" required></p>
                        <br>
                    </div>
                    <div class="colorSchemeContainer">
                        <div class="text__main-input-names">Dark Accent Color:</div> <!--Primary color in mod-->
                            <p><input class="input__main-mod-info" style="width: 80px; margin-left: 7px;" type="color" name="dp" id="dp" min="0" max="100" placeholder="ex. 54" oninput="handleInput('dp', event)" required></p>
                        <br>
                        <div class="text__main-input-names">Dark Secondary Base Color:</div> <!--Accent color in mod-->
                            <p><input class="input__main-mod-info" style="width: 80px; margin-left: 7px;" type="color" name="da" id="da" min="0" max="100" placeholder="ex. 54" oninput="handleInput('da', event)" required></p>
                        <br>
                    </div>     
                </div>
            </div>
            <div class="modInfoInputs" id="modInfoInputs1">
                <div class="text__main-input-names">Mod Name:
                <br>
                <input class="input__main-mod-info" type="text" id="modName" name="mod name" placeholder="ex. My cool Opera GX mod" oninput="handleInput('mod name', event)" required>
                </div>
                <br>
                <div class="text__main-input-names">Mod Author:
                <br>
                <input class="input__main-mod-info" type="text" id="modAuth" name="mod author" placeholder="ex. A Real Cool Coder" oninput="handleInput('mod author', event)" required>
                </div>
                <br>
                <div class="text__main-input-names">Mod Description:
                <br>
                <textarea class="input__main-mod-desc" rows="10" id="modDesc" cols="50" name="mod description" placeholder="ex. A cool mod which makes Opera GX cooler." oninput="handleInput('mod description', event)" required></textarea>
                </div>
                <br>
                <div class="text__main-input-names">Mod Version:
                <br>
                <input class="input__main-mod-info" type="text" id="modVer" name="mod version" pattern="^\d{1,5}(\.\d{1,5}){1,4}$" placeholder="ex. 1.0" oninput="handleInput('mod version', event)" required>
                <div id="verWarn" style="color: red; display: none;">Must be in format xxxxx.xxxxx.xxxxx.xxxxx.xxxxx <br> (ex. 1.0, 1.0.0, 1.0.0.0, 1.0.0.0.0)</div>
                </div>
                <br>
            </div>
        </div>
    </div>
</div>
